name: Check USA Car microservice

on:
  pull_request:
    paths:
      - "services/usa_car/**"
      - "docker-compose.yml"
      - ".github/workflows/usa-car.yml"
  push:
    branches:
      - main
    paths:
      - "services/usa_car/**"
      - "docker-compose.yml"
      - ".github/workflows/usa-car.yml"

jobs:
  checks:
    name: Tests and lint checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build USA Car image
        run: docker compose build usa-car

      - name: Run pytest
        run: docker compose run --rm --no-deps usa-car pytest

      - name: Check formatting with Black
        run: docker compose run --rm --no-deps usa-car black --check .

      - name: Check import sorting with isort
        run: docker compose run --rm --no-deps usa-car isort --check-only .

      - name: Lint with flake8
        run: docker compose run --rm --no-deps usa-car flake8 .

      - name: Type check with mypy
        run: docker compose run --rm --no-deps usa-car mypy app tests
