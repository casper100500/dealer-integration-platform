[project]
name = "usa-car-service"
version = "0.1.0"
description = "File-backed demo inventory provider for USA Car."
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.116,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1,<27.0.0",
    "flake8>=7.3.0,<8.0.0",
    "httpx>=0.28,<1.0",
    "isort>=8.0.1,<9.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pytest>=9.0.2,<10.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
